name: Build MyExpenses Cordova APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Cordova Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install npm dependencies
        run: npm install

      - name: Add Cordova Android platform
        run: npx cordova platform add android@13

      - name: Add local Cordova plugin
        run: npx cordova plugin add ./plugin

      - name: Build Cordova debug APK
        run: npm run build:debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-cordova-debug-apk
          path: platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
