name: Build MyExpenses APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout code
        uses: actions/checkout@v5

      # 2. Java 17
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Accept Android licenses
      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      # 6. Install Cordova
      - name: Install Cordova
        run: |
          npm install -g cordova@12

      # 7. Install project dependencies
      - name: Install project dependencies
        run: |
          npm install

      # 8. Add Android platform
      - name: Add Android platform
        run: |
          cordova platform add android@13 --nofetch
          cordova platform ls

      # 9. Add local native plugin
      - name: Add local native plugin
        run: |
          if [ -d "./plugin" ]; then
            cordova plugin add ./plugin --nofetch
          else
            echo "No local plugin folder found - continuing without it."
          fi
          cordova plugin ls

      # 10. Prepare Cordova project
      - name: Prepare project
        run: |
          cordova prepare android

      # 11. Build APK
      - name: Build Debug APK
        run: |
          cordova build android --debug --verbose
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # 12. Find APK
      - name: Find APK
        id: find_apk
        shell: bash
        run: |
          APK=$(find platforms/android -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "Found APK: $APK"
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

          ls -lh "$APK"

      # 13. Upload APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      # 14. Create GitHub Release
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.1-${{ github.run_number }}
          name: MyExpenses 4.1.1 Build ${{ github.run_number }}
          body: |
            Automatic MyExpenses APK build.

            - Debug APK
            - Fully offline
            - Local storage
            - Entry saving
            - Printing support
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
