name: Build MyExpenses APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # allows manual "Run workflow" button

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Cordova
        run: npm install -g cordova@12

      - name: Install project dependencies
        run: npm install

      - name: Add Android platform
        run: |
          cordova platform add android@13 --nofetch || true
          cordova platform ls

      - name: Add local native plugin
        run: |
          cordova plugin add ./plugin --nofetch || true
          cordova plugin ls

      - name: Prepare project
        run: cordova prepare android

      - name: Build Debug APK
        run: cordova build android --debug --verbose
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

      - name: Find APK
        id: find_apk
        run: |
          APK=$(find platforms/android -name "*.apk" | head -n 1)
          echo "Found APK: $APK"
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          ls -la "$APK"

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyExpenses-debug-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30

      - name: Create GitHub Release (optional)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.1-${{ github.run_number }}
          name: MyExpenses 4.1.1 (Build ${{ github.run_number }})
          body: |
            Automatic build from GitHub Actions.
            - Entry saving fixed (Base64 storage)
            - Printing fixed (strong WebView reference)
            Fully offline.
          files: ${{ steps.find_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
